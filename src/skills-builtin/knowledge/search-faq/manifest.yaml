name: search-faq
version: 1.0.0
description: Search the FAQ knowledge base using semantic similarity and text matching.
category: knowledge
agentType: surface
parameters:
  type: object
  required: [query]
  properties:
    query:
      type: string
      description: The question or topic to search for
    limit:
      type: number
      default: 5
      minimum: 1
      maximum: 20
    minScore:
      type: number
      description: Minimum cosine similarity (0..1). Default 0.5.
      minimum: 0
      maximum: 1
permissions:
  requires: []
  sideEffects: [read]
entry: index
